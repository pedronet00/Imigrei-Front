<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/images/imigrei-icone.svg" />
    <link rel="apple-touch-icon" href="/images/imigrei-icone.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de Gestão de Imigrantes — Cadastro, documentação e acompanhamento de imigrantes." />
    <title>Imigrei — Sistema de Gestão de Imigrantes</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
